# Askesis — default system configuration (public, generic).
# Personal settings (time zone, aliases for personal context variables, …) go in a private override:
# private/askesis.toml (excluded from git), or the file pointed to by ASKESIS_CONFIG.

timezone = "UTC"
nutrition_cutoff = "03:00"   # intakes before this local time belong to the previous nutrition day
weigh_time = "07:00"         # assumed local time of a morning weigh-in when none is given
db_path = "data/askesis.db"
backup_dir = "data/backups"
staging_dir = "data/staging"
source_id = "manual_cli"

# Sealed backups (bin/ak backup seal): encrypted with age to public keys only, private key never on the server.
backup_age_recipients = []          # ["age1…"]: without a key nothing is sealed
backup_sealed_dir = "data/sealed"   # *.db.gz.age + manifest.json: the only backup files that leave the machine
backup_offsite = ""                 # rclone destination, e.g. "drive:askesis-backup" ("" = off)
backup_pull_from = ""               # development machine: rsync source on the server, e.g. "askesis-backup:"
backup_pull_dir = "data/pulled"     # development machine: where pulled sealed copies are kept
backup_identity = ""                # development machine: age private key file or "keychain:<service>"

# alias -> daily_context key, e.g.  myvar = "my_context_variable". Define personal ones privately.
[context_aliases]
