#!/usr/sbin/nft -f
# Askesis server firewall: nothing is reachable from the internet. SSH and the dashboard only through the Meshnet
# interface and only from the listed peers (443: the HTTPS front, when a domain is configured) (/etc/askesis/peers, one IPv4 per line, loaded by install.sh).
# Outgoing traffic is free (updates, Meshnet relays, backups).
# Only this table is replaced: rules owned by other software (the VPN client's own firewall) are left untouched.
table inet askesis {}
delete table inet askesis

table inet askesis {
  set peers {
    type ipv4_addr
    __PEERS__
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    # Meshnet itself (WireGuard) needs its UDP handshake; the tunnel interface carries everything else
    iifname "nordlynx" ip saddr @peers tcp dport { 22, 443, 8765 } accept
    # DHCP replies and ICMP needed by the cloud network
    udp sport 67 udp dport 68 accept
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept
    __BOOTSTRAP_SSH__
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
