name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests (synthetic data only)
        run: uv run pytest
