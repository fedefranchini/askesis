{#- Inline icons (stroke, currentColor): no external resources, CSP-safe. -#}
{% macro icon(name, label=None) -%}
<svg class="ico" viewBox="0 0 24 24" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %} focusable="false">
{%- if name == "oggi" %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == "andamenti" %}<path d="M3.5 17.5l5-6 4 3.5 7.5-9"/><path d="M15 6h5v5"/>
{%- elif name == "coach" %}<path d="M4.5 5.5h15v10h-8l-4.5 4v-4h-2.5z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/>
{%- elif name == "review" %}<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>
{%- elif name == "piano" %}<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>
{%- elif name == "interventi" %}<path d="M6 4v16M6 5h11l-2.5 3.5L17 12H6"/>
{%- elif name == "safety" %}<path d="M12 3.5l7 3v5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9v-5z"/><path d="M12 8.5v4.5M12 16h.01"/>
{%- elif name == "ok" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "warn" %}<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
{%- elif name == "noise" %}<path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/>
{%- elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/>
{%- elif name == "chevron" %}<path d="M9 6l6 6-6 6"/>
{%- elif name == "alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>
{%- endif %}</svg>
{%- endmacro %}
