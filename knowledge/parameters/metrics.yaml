# Metric parameters — the ONLY place where metric constants live (code reads them from here).
#
# basis:
#   evidence            → linked to claims in knowledge/evidence/claims.yaml
#   expert_opinion      → common practice without a verified source in the KB
#   engineering_choice  → a design decision of this system (smoothing, windows, thresholds); revisable
schema_version: "0.1"
last_reviewed: "2026-10-04"
parameters:

  # ---------------- body weight
  weight_daily_rule:
    value: first_fasted_then_first
    basis: engineering_choice
    rationale: "One value per day: first fasted morning weigh-in, otherwise the first of the day (flagged)."
  weight_ma7_min_points:
    value: 4
    unit: days_of_7
    basis: engineering_choice
    rationale: "A 7-day mean is reported only with at least 4 daily values."
  weight_ema_alpha:
    value: 0.1
    unit: per_day
    basis: engineering_choice
    rationale: "Smoothing of daily scale noise (water, gut content); alpha 0.1 ≈ half-life ~6.6 days. Gap-aware: alpha_eff = 1-(1-alpha)^days."
  weight_rate_windows:
    value: [14, 28]
    unit: days
    basis: engineering_choice
    rationale: "Short and long windows to separate noise from trend."
  weight_rate_min_points:
    value: {"14": 8, "28": 14}
    basis: engineering_choice
  rate_ci_level:
    value: 0.90
    basis: engineering_choice
    rationale: "Interval level used for slopes and TDEE."

  # ---------------- nutrition and energy
  intake_min_completeness:
    value: 0.70
    unit: fraction_of_days
    basis: engineering_choice
    rationale: "intake_mean is reported only if ≥70% of the window's days are 'complete'."
  tdee_window_days:
    value: 28
    unit: days
    basis: engineering_choice
    rationale: "Long enough to average water fluctuations; see claim energy.dynamic_response."
    claims: [energy.dynamic_response]
  tdee_min_intake_completeness:
    value: 0.80
    unit: fraction_of_days
    basis: engineering_choice
  tdee_min_weight_days:
    value: 0.70
    unit: fraction_of_days
    basis: engineering_choice
  tissue_energy_density:
    value: 7000
    sd: 800
    unit: kcal_per_kg
    basis: expert_opinion
    rationale: >-
      Converts a short-window weight slope into an energy balance. The value depends on body-composition
      change and is not a fixed constant (energy.dynamic_response); carried with an explicit SD. Listed as a
      gap in the KB.
    claims: [energy.dynamic_response]
  prior_ree_equation:
    value: mifflin_st_jeor
    basis: evidence
    claims: [energy.mifflin_ree]
  prior_activity_factor_default:
    value: 1.55
    basis: expert_opinion
    rationale: "Used only when no athlete-specific factor is recorded; individual error is large."
    claims: [energy.activity_multiplier]
  prior_relative_sd:
    value: 0.15
    unit: fraction_of_prior
    basis: engineering_choice
    rationale: "Wide prior so that ~3–4 weeks of good data dominate the estimate."

  # ---------------- strength
  hard_set_max_rir:
    value: 4
    unit: reps_in_reserve
    basis: engineering_choice
    rationale: >-
      Working sets ending with RIR ≤ 4 count as hard sets. Hypertrophy improves closer to failure but the
      relationship is probably non-linear (rt.proximity_to_failure); the cut-off itself is a convention.
    claims: [rt.proximity_to_failure]
  secondary_muscle_fraction:
    value: 0.5
    basis: evidence
    rationale: "Fractional counting of indirect sets best predicted adaptations."
    claims: [rt.volume_dose_response]
  e1rm_formula:
    value: epley_reps_plus_rir
    basis: expert_opinion
    rationale: >-
      e1RM = load × (1 + (reps + RIR) / 30). Epley is a widely used estimate without a verified source in
      the KB; RIR adjustment follows the RIR-based scale (rt.rir_scale). Sets without RIR give a lower bound.
    claims: [rt.rir_scale]
  e1rm_max_reps_equivalent:
    value: 12
    basis: engineering_choice
    rationale: "Estimates from reps+RIR > 12 are too imprecise and are not computed."

  # ---------------- running and activity
  week_definition:
    value: iso_monday_to_sunday
    basis: engineering_choice
  steps_min_days_for_mean:
    value: 4
    unit: days_of_7
    basis: engineering_choice

  # ---------------- data quality
  dq_grade_thresholds:
    value: {A: 0.90, B: 0.75, C: 0.50}
    basis: engineering_choice
    rationale: "Grade is set by the weakest component (docs/architecture.md §13.3)."
  weight_jump_soft_kg:
    value: 2.0
    unit: kg
    basis: engineering_choice
    rationale: "Day-to-day change above this opens a soft data-quality issue (not a rejection)."

  # ---------------- weekly review traffic light
  review_sessions_missed_yellow:
    value: 1
    unit: sessions
    basis: engineering_choice
    rationale: "Weekly review: up to this many planned strength sessions missed is yellow; more is red; none is green."
  review_strength_red_weeks:
    value: 3
    unit: consecutive_weeks
    basis: engineering_choice
    rationale: "Weekly review: an exercise whose e1RM falls beyond noise for this many consecutive weeks is red. Same
      count as the fat-loss phase exit criterion (strength falling for 3 consecutive weeks: reassess the deficit)."

  # ---------------- adherence and noise (weekly review)
  sleep_recommended_min_h:
    value: 7
    unit: hours_per_night
    basis: evidence
    rationale: "Adults should regularly sleep 7 or more hours per night (AASM/SRS consensus). Used for the sleep status colour."
    claims: [sleep.adult_recommendation]
  protein_status_tolerance:
    value: 0.10
    unit: fraction_of_target
    basis: engineering_choice
    rationale: "Today page: protein below target by more than this fraction shows as attention (amber). Same width as the intake tolerance of calorie_adjustment@2; above target is never flagged."
  volume_reference_sets_week:
    value: [12, 20]
    unit: weekly_sets_per_muscle
    basis: evidence
    rationale: "Reference band drawn on the weekly volume chart (moderate volume for hypertrophy; low certainty, trained young men). Compared with fractional sets, see the claim's limitations."
    claims: [rt.volume_range_12_20]
  strength_fundamentals_per_session:
    value: 2
    unit: lifts
    basis: engineering_choice
    rationale: "Trends page: the strength question follows only the first N multi-joint lifts of each planned session (the programme puts the main lifts first, claim rt.exercise_order)."
  adherence_min_days_of_7:
    value: 4
    unit: complete_days_of_7
    basis: engineering_choice
    rationale: "Trends page: energy and protein vs target are judged only with at least this many complete days in the last 7."
  sleep_min_days_for_mean:
    value: 4
    unit: nights_of_7
    basis: engineering_choice
  noise_min_sessions:
    value: 3
    unit: sessions_with_repeated_readings
    basis: engineering_choice
    rationale: "Measurement noise (TEM) is estimated from within-session repeated readings only with at least this many sessions; before that it is reported as not yet estimable."
  noise_min_points:
    value: 4
    unit: past_week_to_week_changes
    basis: engineering_choice
    rationale: "Week-to-week noise of a weekly best (e.g. e1RM) is estimated only with at least this many past changes."
  minimal_difference_z:
    value: 1.96
    basis: expert_opinion
    rationale: >-
      Minimal detectable difference = z × √2 × SEM (SEM of a session mean = TEM/√k); a change beyond it is reported as
      real. The SEM-based minimal difference is supported by the KB; the exact formula is not in the abstract read.
    claims: [measure.sem_minimal_difference]
  checkin_quality_window_days:
    value: 28
    unit: days
    basis: engineering_choice
    rationale: "Window for the response-quality summary of the morning questionnaire (how many days answered)."
  checkin_identical_streak_days:
    value: 5
    unit: consecutive_answered_days
    basis: engineering_choice
    rationale: "Identical answers (at least three items) on this many consecutive answered days are pointed out as possibly automatic; a hint to answer how one feels today, never a judgement."
  e1rm_session_noise_floor_reps:
    value: 1
    unit: reps_at_the_same_load
    basis: engineering_choice
    rationale: "Minimal difference of a session e1RM is never below the e1RM effect of this many reps at the session's top load (Epley: load × reps / 30): with few or identical past sessions the measured spread can be near zero."

  # --- training load (Foster) ---
  session_load_formula:
    value: cr10_x_minutes
    basis: evidence
    rationale: "Session load = session-RPE (CR-10 scale) × duration in minutes, in arbitrary units (AU); the code supports only this formula."
    claims: [load.monotony_strain]
  monotony_sd:
    value: population
    basis: engineering_choice
    rationale: "Monotony divides the mean daily load by the population SD (ddof=0) of the 7 days, as in common practice with Foster's spreadsheet; the sample SD would give a larger value for the same week. Revisable."

  # ---------------- aerobic running efficiency
  # Assumption (all parameters below): within the easy range speed is taken as proportional to heart rate, so
  # metres per heartbeat is comparable between runs. Heat, hydration, terrain, fatigue and cardiac drift add noise
  # that is not modelled; the noise is the run-to-run variability of comparable runs, which also contains real
  # changes (conservative).
  run_eff_min_minutes:
    value: 15
    unit: min
    basis: engineering_choice
    rationale: "A run counts as comparable only if it lasts at least this long (moving time when present): the average heart rate of a shorter run is dominated by the warm-up. Assumption: speed proportional to heart rate within the easy range."
  run_eff_max_elev_m_per_km:
    value: 10
    unit: m/km
    basis: engineering_choice
    rationale: "A run with more climb per km is not comparable (climbing raises heart rate at equal speed); unknown elevation is allowed and flagged. Terrain and heat are otherwise not modelled."
  run_eff_window:
    value: 3
    unit: runs
    basis: engineering_choice
    rationale: "Efficiency change compares the mean of the last k comparable runs with the k before; k = 3 smooths single-run noise while reacting within weeks. Revisable."
  run_eff_min_noise_runs:
    value: 4
    unit: runs
    basis: engineering_choice
    rationale: "Noise (sample SD of efficiency) is estimated from the comparable runs before the current window only with at least this many; fewer: the change is reported as not estimable. The noise is run-to-run variability, which also contains real changes (conservative); no default value is invented."

  # ---------------- running records
  run_record_pace_min_km:
    value: [3, 5, 10]
    unit: km
    basis: engineering_choice
    rationale: "Only total distance and time are recorded (no splits), so the pace record is the average pace of a whole run of at least that distance, not a best effort within a run. Thresholds are the distance buckets in which a run can set a pace record."
