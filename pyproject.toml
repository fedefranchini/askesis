[project]
name = "askesis"
version = "0.1.0"
description = "Local-first, evidence-based longitudinal AI athlete coach (data core + CLI)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
askesis = "askesis.cli.main:app"
ak = "askesis.cli.main:app"

[project.optional-dependencies]
dashboard = [
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "playwright==1.63.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # robust against hidden .pth files on macOS
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
